name: Build & Push Docker image on Release

# Shape (CR §18, donor: dnms-service-template release-core, inlined because this public
# repository cannot call a private-org reusable workflow):
#   build — one native leg per architecture. Builds the image ONCE into an OCI archive,
#           runs the Trivy gate on that archive's image, and only then pushes the very
#           same archive BY DIGEST (untagged). Nothing reaches the registry unscanned.
#   merge — assembles the per-arch digests into the tagged index, asserts the index has
#           exactly one linux child per leg, and signs the INDEX digest (keyless cosign).
# Every third-party action is pinned by commit SHA.

on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to (re)build, e.g. 2.1.13
        required: true
        type: string

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  # Hard-coded on purpose: the image name is the product identity and must not
  # move if the GitHub repo is renamed (e.g. multi-module -parent suffix).
  # Using `github.repository` here silently splits the ghcr.io path across
  # rename events and breaks downstream consumers pinning the old coordinate.
  IMAGE: opentmf/opentmf-mockserver
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  # Same scanner and settings as the local `docker` profile's trivy-gate.
  TRIVY_IMAGE: aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
  SKOPEO_IMAGE: quay.io/skopeo/stable:v1.22.3@sha256:92e2b4fc45571c2e6e76e8c74a3d43ed53336ab4f1c4ad39dc6f89ae0bb6b077

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        target:
          - { platform: linux/amd64, arch: amd64, runner: ubuntu-24.04 }
          - { platform: linux/arm64, arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.target.runner }}
    env:
      SCAN_REF: trivy-scan-target:${{ github.run_id }}-${{ matrix.target.arch }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Docker meta (labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=Built from release ${{ env.RELEASE_TAG }}

      # One build, one archive: `type=docker` with OCI media types holds both
      # manifest.json (for `docker load`, which Trivy scans) and index.json (for the
      # by-digest push), so the scanned image and the pushed image are one artifact.
      # Buildx attestations are off so the archive holds the platform manifest alone.
      - name: Build this architecture's image once, as an archive
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: ./Dockerfile_release
          platforms: ${{ matrix.target.platform }}
          outputs: type=docker,dest=${{ runner.temp }}/leg-image.tar,oci-mediatypes=true,name=${{ env.SCAN_REF }}
          labels: ${{ steps.meta.outputs.labels }}
          no-cache: true
          provenance: false
          sbom: false

      - name: Load the archive and record its identity
        id: archive
        shell: bash
        env:
          ARCHIVE: ${{ runner.temp }}/leg-image.tar
        run: |
          set -euo pipefail
          docker load -i "$ARCHIVE"
          meta=$(mktemp -d)
          tar -xf "$ARCHIVE" -C "$meta" index.json
          [ "$(jq '.manifests | length' "$meta/index.json")" -eq 1 ] \
            || { echo "::error::the archive holds more than one manifest"; exit 1; }
          digest=$(jq -r '.manifests[0].digest' "$meta/index.json")
          tar -xf "$ARCHIVE" -C "$meta" "blobs/sha256/${digest#sha256:}"
          config=$(jq -r '.config.digest' "$meta/blobs/sha256/${digest#sha256:}")
          loaded=$(docker image inspect "$SCAN_REF" --format '{{.Id}}')
          [ "$config" = "$loaded" ] \
            || { echo "::error::archive config ${config} is not the loaded image ${loaded}"; exit 1; }
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "config=${config}" >> "$GITHUB_OUTPUT"

      # The gate: fixable HIGH/CRITICAL fails the leg before anything is pushed.
      - name: Trivy gate (HIGH,CRITICAL, ignore-unfixed, .trivyignore)
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${PWD}/opentmf-mockserver/.trivyignore:/.trivyignore:ro" \
            "$TRIVY_IMAGE" image \
            --ignorefile /.trivyignore \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            "$SCAN_REF"

      - name: Login to GHCR with PAT
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: gokhanus
          password: ${{ secrets.GH_TOKEN }}

      - name: Push the scanned archive by digest
        id: push
        shell: bash
        env:
          ARCHIVE_DIR: ${{ runner.temp }}
          DIGEST: ${{ steps.archive.outputs.digest }}
          GHCR_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -euo pipefail
          auth="${ARCHIVE_DIR}/skopeo-auth.json"
          ( umask 077
            jq -n --arg r "$REGISTRY" --arg a "$(printf '%s:%s' gokhanus "$GHCR_TOKEN" | base64 -w0)" \
              '{auths: {($r): {auth: $a}}}' > "$auth" )
          trap 'rm -f "$auth"' EXIT
          docker run --rm -v "${ARCHIVE_DIR}:/w" "$SKOPEO_IMAGE" copy --preserve-digests \
            --authfile /w/skopeo-auth.json \
            oci-archive:/w/leg-image.tar "docker://${REGISTRY}/${IMAGE}@${DIGEST}"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: The pushed image is the scanned image
        shell: bash
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          SCANNED_CONFIG: ${{ steps.archive.outputs.config }}
        run: |
          set -euo pipefail
          raw=$(docker buildx imagetools inspect "${REGISTRY}/${IMAGE}@${DIGEST}" --raw)
          served="sha256:$(printf '%s' "$raw" | sha256sum | cut -d' ' -f1)"
          config=$(jq -r '.config.digest // empty' <<<"$raw")
          if [ "$served" != "$DIGEST" ] || [ "$config" != "$SCANNED_CONFIG" ]; then
            echo "::error::registry serves ${served} / ${config}, scanned ${DIGEST} / ${SCANNED_CONFIG}"
            exit 1
          fi

      - name: Export the digest
        shell: bash
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p "${{ runner.temp }}/digests"
          touch "${{ runner.temp }}/digests/${DIGEST#sha256:}"

      - name: Upload the digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: digest-${{ matrix.target.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write   # keyless cosign sign (Fulcio OIDC)
    steps:
      - name: Login to GHCR with PAT
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: gokhanus
          password: ${{ secrets.GH_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Docker meta (tags)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.RELEASE_TAG }}
            type=semver,pattern={{major}},value=${{ env.RELEASE_TAG }}
            type=raw,value=latest

      - name: Download the digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - name: Create the tagged index from the scanned digests
        shell: bash
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          TAG_ARGS=$(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          [ -n "$TAG_ARGS" ] || { echo "::error::metadata-action produced no tags"; exit 1; }
          shopt -s nullglob
          digest_files=(*)
          [ ${#digest_files[@]} -gt 0 ] || { echo "::error::no digests downloaded"; exit 1; }
          DIGEST_REFS="${digest_files[*]/#/${REGISTRY}/${IMAGE}@sha256:}"
          # shellcheck disable=SC2086
          docker buildx imagetools create $TAG_ARGS $DIGEST_REFS

      # Before the signature: a misassembled index is never signed.
      - name: Assert the index has one linux child per architecture
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          digest_files=("${{ runner.temp }}"/digests/*)
          EXPECTED=${#digest_files[@]}
          RAW=$(docker buildx imagetools inspect "${REGISTRY}/${IMAGE}:${DOCKER_METADATA_OUTPUT_VERSION}" --raw)
          TOTAL=$(jq '.manifests | length' <<< "$RAW")
          LINUX=$(jq '[.manifests[] | select(.platform.os == "linux")] | length' <<< "$RAW")
          echo "index children: total=${TOTAL} linux=${LINUX} expected=${EXPECTED}"
          if [ "$EXPECTED" -eq 0 ] || [ "$TOTAL" -ne "$EXPECTED" ] || [ "$LINUX" -ne "$EXPECTED" ]; then
            jq '.manifests[] | {digest, platform}' <<< "$RAW"
            exit 1
          fi

      # Signs the index DIGEST, never a (mutable) tag. Keyless: the identity is this
      # workflow's GitHub OIDC token; the certificate lands in the public Rekor log.
      - name: Sign the index digest (keyless)
        shell: bash
        run: |
          set -euo pipefail
          TAG="${DOCKER_METADATA_OUTPUT_VERSION}"
          DIGEST=$(docker buildx imagetools inspect "${REGISTRY}/${IMAGE}:${TAG}" \
            --format '{{json .Manifest}}' | jq -r .digest)
          if [ -z "$DIGEST" ] || [ "$DIGEST" = "null" ]; then
            echo "::error::no index digest for ${TAG}"
            exit 1
          fi
          cosign sign --yes "${REGISTRY}/${IMAGE}@${DIGEST}"
          cosign verify "${REGISTRY}/${IMAGE}@${DIGEST}" \
            --certificate-identity-regexp "^${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          echo "signed and verified ${REGISTRY}/${IMAGE}@${DIGEST} (${TAG})"
