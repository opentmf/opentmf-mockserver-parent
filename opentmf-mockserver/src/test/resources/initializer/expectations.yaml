# Twin of expectations.json, written as YAML so it can carry comments.

# --- SMS gateway (Kannel) ---------------------------------------------
# 202, not 200: the gateway ACKs and delivers asynchronously.
- httpRequest:  { method: POST, path: /cgi-bin/sendsms }
  httpResponse: { statusCode: 202 }

# --- customer lookup --------------------------------------------------
- httpRequest:
    method: GET
    path: /customer/{id}
    pathParameters:
      id: ["[0-9]+"]
  httpResponse:
    statusCode: 200
    headers:
      Content-Type: [application/json]
    body:
      type: JSON
      json: { id: "42", name: Ada }
  times: { remainingTimes: 3, unlimited: false }
  priority: 5 # matched before the catch-all
